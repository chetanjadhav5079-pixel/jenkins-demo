<!DOCTYPE html>
<html>
<head>
    <title>Jenkins CI/CD Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding-top: 120px;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            margin: auto;
            width: 500px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 42px;
        }

        p {
            font-size: 20px;
        }

        .status {
            margin-top: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>🚀 Jenkins CI/CD</h1>

    <p>Welcome to my DevOps project</p>

    <p class="status">
        ✅ Deployment Successful
    </p>

    <p>
        GitHub → Jenkins → Docker → ECR → EKS
    </p>
</div>

</body>
</html>
